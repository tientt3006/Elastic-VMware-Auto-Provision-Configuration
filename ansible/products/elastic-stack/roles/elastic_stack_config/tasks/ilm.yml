---
- name: Set API URLs
  ansible.builtin.set_fact:
    es_api_url: "http://{{ hostvars[groups['elastic_cluster'][0]]['ansible_host'] }}:9200"
    kibana_api_url: "http://{{ hostvars[groups['kibana_gateway'][0]]['ansible_host'] }}:5601"

- name: Wait for Elasticsearch API to be ready
  ansible.builtin.uri:
    url: "{{ es_api_url }}/_cluster/health"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    status_code: 200
  register: es_status
  until: es_status.status == 200
  retries: 30
  delay: 10
  delegate_to: localhost

- name: Set target ES API URL for safeguards
  ansible.builtin.set_fact:
    target_es_api_url: "{{ es_api_url }}"

- name: Apply cluster safeguards (Watermarks and Default ILM)
  ansible.builtin.include_tasks: cluster_safeguards.yml

- name: Create FortiGate ILM Policy
  ansible.builtin.uri:
    url: "{{ es_api_url }}/_ilm/policy/fortigate"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "policy": {
          "phases": {
            "hot": {
              "actions": {
                "rollover": {
                  "max_primary_shard_size": "{{ ilm_rollover_max_size | default('10gb') }}",
                  "max_age": "{{ ilm_rollover_max_age | default('1d') }}"
                }
              }
            },
            "delete": {
              "min_age": "{{ ilm_retention_days | default('7d') }}",
              "actions": {
                "delete": {}
              }
            }
          }
        }
      }
    status_code: [200, 201]
  delegate_to: localhost

- name: Create Dedicated vSphere ILM Policy
  ansible.builtin.uri:
    url: "{{ es_api_url }}/_ilm/policy/vsphere-ilm-policy"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "policy": {
          "phases": {
            "hot": {
              "actions": {
                "rollover": {
                  "max_primary_shard_size": "{{ ilm_rollover_max_size | default('10gb') }}",
                  "max_age": "{{ ilm_rollover_max_age | default('1d') }}"
                }
              }
            },
            "delete": {
              "min_age": "{{ ilm_retention_days | default('7d') }}",
              "actions": {
                "delete": {}
              }
            }
          }
        }
      }
    status_code: [200, 201]
  delegate_to: localhost

