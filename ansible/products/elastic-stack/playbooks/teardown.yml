---
- name: Teardown Elastic Stack, Fleet Server, and Elastic Agent
  hosts: all
  become: true
  tasks:
    - name: Check if Elastic Agent is installed
      ansible.builtin.stat:
        path: /usr/bin/elastic-agent
      register: elastic_agent_bin

    - name: Uninstall Elastic Agent if present
      ansible.builtin.command:
        argv:
          - /usr/bin/elastic-agent
          - uninstall
          - --force
      when: elastic_agent_bin.stat.exists
      ignore_errors: true

    - name: Remove Elastic Agent leftover directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/Elastic
        - /etc/elastic-agent
        - /var/tmp/elastic-agent

    - name: Check if Compose file exists
      ansible.builtin.stat:
        path: "{{ elastic_compose_dir | default('/opt/elastic-stack') }}/compose.yml"
      register: compose_file

    - name: Stop and remove Elastic Stack Docker containers
      community.docker.docker_compose_v2:
        project_src: "{{ elastic_compose_dir | default('/opt/elastic-stack') }}"
        state: absent
        remove_volumes: true
      when: compose_file.stat.exists
      ignore_errors: true

    - name: Remove Elastic Stack data and project directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ elastic_compose_dir | default('/opt/elastic-stack') }}"
        - "{{ elastic_data_dir | default('/var/lib/elastic-stack/elasticsearch') }}"
