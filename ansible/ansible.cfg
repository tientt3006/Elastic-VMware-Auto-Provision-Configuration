[defaults]
inventory = ./products/elastic-stack/inventories/lab/hosts.yml
roles_path = ./products/elastic-stack/roles:./products/zabbix/roles:./products/haproxy/roles:./products/infra-services/roles:./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
deprecation_warnings = False
interpreter_python = auto_silent
timeout = 30
remote_user = <SSH_USER>
# vault_password_file = ./.vault_pass


[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20
