---
# ==============================================================================
# Role: vsphere_observability
# Configures VMware vSphere Integration (Metrics & Syslog) on Kibana Fleet
# ==============================================================================

- name: Set dynamic Kibana API URL from inventory
  ansible.builtin.set_fact:
    kibana_api_url: "http://{{ hostvars[groups['kibana_gateway'][0]]['ansible_host'] }}:5601"
  delegate_to: localhost

- name: Check Kibana API availability
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/status"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    status_code: 200
  register: kibana_health
  retries: 15
  delay: 4
  until: kibana_health.status == 200
  delegate_to: localhost

- name: Set dynamic Elasticsearch Hosts from inventory
  ansible.builtin.set_fact:
    elasticsearch_cluster_hosts: "{{ groups['elastic_cluster'] | default([]) | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^(.*)$', 'http://\\1:9200') | list }}"
  delegate_to: localhost

- name: Ensure Fleet Default Output points to Elasticsearch cluster
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      content-type: "application/json"
    body_format: json
    body: |
      {
        "name": "default",
        "type": "elasticsearch",
        "is_default": true,
        "is_default_monitoring": true,
        "hosts": {{ (elasticsearch_cluster_hosts | length > 0) | ternary(elasticsearch_cluster_hosts, [fleet_server_elasticsearch_url | default('http://10.255.242.91:9200')]) | to_json }}
      }
    status_code: [200]
  delegate_to: localhost
  ignore_errors: true

- name: Set primary Elasticsearch API URL
  ansible.builtin.set_fact:
    primary_es_url: "{{ (elasticsearch_cluster_hosts | length > 0) | ternary(elasticsearch_cluster_hosts[0], fleet_server_elasticsearch_url | default('http://10.255.242.91:9200')) }}"
  delegate_to: localhost

- name: Enforce Cluster Disk Allocation Watermarks (Capped at 70%)
  ansible.builtin.uri:
    url: "{{ primary_es_url }}/_cluster/settings"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      content-type: "application/json"
    body_format: json
    body: |
      {
        "persistent": {
          "cluster.routing.allocation.disk.watermark.low": "{{ disk_watermark_low | default('60%') }}",
          "cluster.routing.allocation.disk.watermark.high": "{{ disk_watermark_high | default('70%') }}",
          "cluster.routing.allocation.disk.watermark.flood_stage": "{{ disk_watermark_flood_stage | default('75%') }}",
          "cluster.info.update.interval": "30s",
          "indices.lifecycle.poll_interval": "5m"
        }
      }
    status_code: [200]
  delegate_to: localhost
  ignore_errors: true

- name: Enforce Default Logs ILM Policy (Auto-Delete after retention period)
  ansible.builtin.uri:
    url: "{{ primary_es_url }}/_ilm/policy/logs"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      content-type: "application/json"
    body_format: json
    body: |
      {
        "policy": {
          "phases": {
            "hot": {
              "actions": {
                "rollover": {
                  "max_primary_shard_size": "{{ ilm_rollover_max_size | default('10gb') }}",
                  "max_age": "{{ ilm_rollover_max_age | default('1d') }}"
                }
              }
            },
            "delete": {
              "min_age": "{{ ilm_retention_days | default('7d') }}",
              "actions": {
                "delete": {}
              }
            }
          }
        }
      }
    status_code: [200]
  delegate_to: localhost
  ignore_errors: true

- name: Enforce Default Metrics ILM Policy (Auto-Delete after retention period)
  ansible.builtin.uri:
    url: "{{ primary_es_url }}/_ilm/policy/metrics"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      content-type: "application/json"
    body_format: json
    body: |
      {
        "policy": {
          "phases": {
            "hot": {
              "actions": {
                "rollover": {
                  "max_primary_shard_size": "{{ ilm_rollover_max_size | default('10gb') }}",
                  "max_age": "{{ ilm_rollover_max_age | default('1d') }}"
                }
              }
            },
            "delete": {
              "min_age": "{{ ilm_retention_days | default('7d') }}",
              "actions": {
                "delete": {}
              }
            }
          }
        }
      }
    status_code: [200]
  delegate_to: localhost
  ignore_errors: true

- name: Get vSphere package version
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/fleet/epm/packages/vsphere"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
  register: vsphere_package_info
  delegate_to: localhost

- name: Install vSphere Integration Package (Latest with Assets and Pipelines)
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/fleet/epm/packages/vsphere/{{ vsphere_package_info.json.item.version | default('1.25.0') }}"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      content-type: "application/json"
    body_format: json
    body: '{"force": true}'
    status_code: [200, 201, 400, 409]
  delegate_to: localhost
  ignore_errors: true

- name: Query existing Fleet Package Policies
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/fleet/package_policies"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
  register: existing_package_policies
  delegate_to: localhost

- name: Remove outdated vsphere-monitoring policy if existing
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/fleet/package_policies/{{ item.id }}"
    method: DELETE
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    status_code: [200, 404]
  loop: "{{ existing_package_policies.json['items'] | default([]) }}"
  when: item.name == 'vsphere-monitoring'
  delegate_to: localhost

- name: Create vSphere Integration Policy (Metrics Polling & Syslog UDP 9525)
  ansible.builtin.uri:
    url: "{{ kibana_api_url }}/api/fleet/package_policies"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      content-type: "application/json"
    body_format: json
    body: |
      {
        "name": "vsphere-monitoring",
        "description": "VMware vSphere Metrics & Syslog Collection",
        "namespace": "default",
        "policy_id": "fleet-server-policy",
        "package": {
          "name": "vsphere",
          "title": "VMware vSphere",
          "version": "{{ vsphere_package_info.json.item.version | default('1.25.0') }}"
        },
        "inputs": [
          {
            "type": "vsphere/metrics",
            "enabled": true,
            "streams": [
              {
                "id": "vsphere.cluster",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.cluster", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-cluster"], "type": "text" }
                }
              },
              {
                "id": "vsphere.host",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.host", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-host"], "type": "text" }
                }
              },
              {
                "id": "vsphere.datastore",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.datastore", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-datastore"], "type": "text" }
                }
              },
              {
                "id": "vsphere.virtualmachine",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.virtualmachine", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-virtualmachine"], "type": "text" }
                }
              },
              {
                "id": "vsphere.network",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.network", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-network"], "type": "text" }
                }
              },
              {
                "id": "vsphere.resourcepool",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.resourcepool", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-resourcepool"], "type": "text" }
                }
              },
              {
                "id": "vsphere.datastorecluster",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.datastorecluster", "type": "metrics" },
                "vars": {
                  "period": { "value": "20s", "type": "text" },
                  "tags": { "value": ["vsphere-datastorecluster"], "type": "text" }
                }
              }
            ],
            "vars": {
              "hosts": { "value": ["https://{{ vcenter_server }}/sdk"], "type": "text" },
              "username": { "value": "{{ vcenter_readonly_user if '@' in vcenter_readonly_user else (vcenter_readonly_user ~ '@vsphere.local') }}", "type": "text" },
              "password": { "value": "{{ vcenter_readonly_password }}", "type": "password" },
              "insecure": { "value": true, "type": "bool" }
            }
          },
          {
            "type": "udp",
            "enabled": true,
            "streams": [
              {
                "id": "udp-vsphere.log",
                "enabled": true,
                "data_stream": { "dataset": "vsphere.log", "type": "logs" },
                "vars": {
                  "listen_address": { "value": "0.0.0.0", "type": "text" },
                  "listen_port": { "value": 9525, "type": "number" },
                  "preserve_original_event": { "value": false, "type": "bool" },
                  "tags": { "value": ["vmware-vsphere"], "type": "text" }
                }
              }
            ]
          }
        ]
      }
    status_code: [200, 201]
  delegate_to: localhost

