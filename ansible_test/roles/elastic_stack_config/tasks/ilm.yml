---
- name: Set API URLs
  ansible.builtin.set_fact:
    es_api_url: "http://{{ hostvars[groups['elastic_cluster'][0]]['ansible_host'] }}:9200"
    kibana_api_url: "http://{{ hostvars[groups['kibana_gateway'][0]]['ansible_host'] }}:5601"

- name: Wait for Elasticsearch API to be ready
  ansible.builtin.uri:
    url: "{{ es_api_url }}/_cluster/health"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    status_code: 200
  register: es_status
  until: es_status.status == 200
  retries: 30
  delay: 10
  delegate_to: localhost

- name: Configure Cluster Disk Allocation Watermarks (Capped at 70%)
  ansible.builtin.uri:
    url: "{{ es_api_url }}/_cluster/settings"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      content-type: "application/json"
    body_format: json
    body: |
      {
        "persistent": {
          "cluster.routing.allocation.disk.watermark.low": "{{ disk_watermark_low | default('60%') }}",
          "cluster.routing.allocation.disk.watermark.high": "{{ disk_watermark_high | default('70%') }}",
          "cluster.routing.allocation.disk.watermark.flood_stage": "{{ disk_watermark_flood_stage | default('75%') }}",
          "cluster.info.update.interval": "30s",
          "indices.lifecycle.poll_interval": "5m"
        }
      }
    status_code: [200]
  delegate_to: localhost

- name: Configure Default Logs ILM Policy (Auto-Delete after retention period)
  ansible.builtin.uri:
    url: "{{ es_api_url }}/_ilm/policy/logs"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: true
    headers:
      content-type: "application/json"
    body_format: json
    body: |
      {
        "policy": {
          "phases": {
            "hot": {
              "actions": {
                "rollover": {
                  "max_primary_shard_size": "{{ ilm_rollover_max_size | default('10gb') }}",
                  "max_age": "{{ ilm_rollover_max_age | default('1d') }}"
                }
              }
            },
            "delete": {
              "min_age": "{{ ilm_retention_days | default('7d') }}",
              "actions": {
                "delete": {}
              }
            }
          }
        }
      }
    status_code: [200]
  delegate_to: localhost

