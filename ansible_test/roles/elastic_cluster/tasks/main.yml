---
# ==============================================================================
# Tasks for role: elastic_cluster (High Availability Multi-Node Cluster)
# ==============================================================================

- name: Apply OS kernel tuning for Elasticsearch (vm.max_map_count)
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: true

- name: Disable swap memory for optimal JVM performance
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "1"
    state: present
    reload: true

- name: Ensure apt-transport-https and ca-certificates are installed
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add Elastic APT signing key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /usr/share/keyrings/elasticsearch-keyring.asc
    mode: "0644"

- name: Add Elastic APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.asc] https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Install Elasticsearch package
  ansible.builtin.apt:
    name: "elasticsearch={{ elastic_version | default('8.19.0') }}*"
    state: present
    update_cache: true

- name: Remove auto-generated SSL passwords from keystore (conflict with custom PKI)
  ansible.builtin.command:
    cmd: "/usr/share/elasticsearch/bin/elasticsearch-keystore remove {{ item }}"
  loop:
    - xpack.security.transport.ssl.keystore.secure_password
    - xpack.security.transport.ssl.truststore.secure_password
    - xpack.security.http.ssl.keystore.secure_password
  register: keystore_remove
  failed_when: keystore_remove.rc != 0 and 'does not exist' not in (keystore_remove.stderr + keystore_remove.stdout)
  changed_when: keystore_remove.rc == 0

- name: Create systemd override directory for Elasticsearch
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure systemd override for Elasticsearch memory lock
  ansible.builtin.copy:
    dest: /etc/systemd/system/elasticsearch.service.d/override.conf
    content: |
      [Service]
      LimitMEMLOCK=infinity
      LimitNOFILE=65535
    owner: root
    group: root
    mode: "0644"
  register: systemd_override

- name: Reload systemd daemon if override changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: systemd_override.changed

- name: Configure JVM heap memory
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: |
      -Xms{{ elastic_heap_size | default('2g') }}
      -Xmx{{ elastic_heap_size | default('2g') }}
    owner: root
    group: elasticsearch
    mode: "0640"
  notify: Restart Elasticsearch

# ------------------------------------------------------------------------------
# Automated Multi-Node PKI Certificate Generation & Distribution
# ------------------------------------------------------------------------------
- name: Check if cluster certificates already exist on node
  ansible.builtin.stat:
    path: /etc/elasticsearch/elastic-certificates.p12
  register: cert_file_stat

- name: Generate Certificate Authority (CA) on primary master node
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-certutil ca --silent --pass "" --out /tmp/elastic-stack-ca.p12
    creates: /tmp/elastic-stack-ca.p12
  when:
    - inventory_hostname == groups['elastic_cluster'][0]
    - not cert_file_stat.stat.exists

- name: Generate cluster certificates from CA on primary master node
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-certutil cert --silent --ca /tmp/elastic-stack-ca.p12 --pass "" --ca-pass "" --out /tmp/elastic-certificates.p12
    creates: /tmp/elastic-certificates.p12
  when:
    - inventory_hostname == groups['elastic_cluster'][0]
    - not cert_file_stat.stat.exists

- name: Copy generated certificates to primary node elasticsearch dir
  ansible.builtin.copy:
    src: /tmp/elastic-certificates.p12
    dest: /etc/elasticsearch/elastic-certificates.p12
    remote_src: true
    owner: root
    group: elasticsearch
    mode: "0640"
  when:
    - inventory_hostname == groups['elastic_cluster'][0]
    - not cert_file_stat.stat.exists

- name: Fetch certificates to Ansible controller from primary node
  ansible.builtin.fetch:
    src: /etc/elasticsearch/elastic-certificates.p12
    dest: /tmp/ansible-elastic-certificates.p12
    flat: true
  when:
    - inventory_hostname == groups['elastic_cluster'][0]

- name: Distribute cluster certificates to all nodes
  ansible.builtin.copy:
    src: /tmp/ansible-elastic-certificates.p12
    dest: /etc/elasticsearch/elastic-certificates.p12
    owner: root
    group: elasticsearch
    mode: "0640"
  when: not cert_file_stat.stat.exists
  notify: Restart Elasticsearch

# ------------------------------------------------------------------------------
# Deploy Elasticsearch Cluster Configuration
# ------------------------------------------------------------------------------
- name: Allow Elasticsearch HTTP (9200) and Transport (9300) ports through firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "9200"
    - "9300"

- name: Deploy elasticsearch.yml configuration
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: Restart Elasticsearch

- name: Ensure Elasticsearch service is enabled and running
  ansible.builtin.systemd:
    name: elasticsearch
    enabled: true
    state: started

- name: Wait for Elasticsearch HTTP API to become reachable
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200"
    method: GET
    status_code: [200, 401]
  register: es_api_check
  until: es_api_check.status in [200, 401]
  retries: 30
  delay: 5

- name: Set password for elastic superuser (on primary node)
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -b -i --url http://127.0.0.1:9200
    stdin: "{{ elastic_password }}\n{{ elastic_password }}\n"
  when: inventory_hostname == groups['elastic_cluster'][0]
  changed_when: true
  ignore_errors: true
  register: reset_elastic_pass
  until: reset_elastic_pass.rc == 0
  retries: 30
  delay: 10

- name: Set password for kibana_system user (on primary node)
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-reset-password -u kibana_system -b -i --url http://127.0.0.1:9200
    stdin: "{{ kibana_system_password }}\n{{ kibana_system_password }}\n"
  when: inventory_hostname == groups['elastic_cluster'][0]
  changed_when: true
  ignore_errors: true
  register: reset_kibana_pass
  until: reset_kibana_pass.rc == 0
  retries: 30
  delay: 10
